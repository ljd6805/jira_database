[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-raw-data-collector"
version = "0.1.0"
description = "Read-only Jira raw JSON collector with rate limiting and resume support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "jira_database contributors" }]
dependencies = [
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
]

[project.scripts]
jira-collector = "jira_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

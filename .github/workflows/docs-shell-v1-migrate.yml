name: One-shot Documentation Shell v1 Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-shell-v1-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply document shell v1
        run: |
          python tools/docs/sync_document_shell.py --write
          python tools/docs/sync_document_shell.py --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs tools/docs tests
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "docs: migrate all HTML to document shell v1"
          git push

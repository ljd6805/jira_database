<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이전 현황 종합본 — 최신 상태는 status 문서 참조</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf0ff;font-family:"Malgun Gothic",system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:760px;background:#141b34;border:1px solid #2d3967;border-radius:18px;padding:24px;box-shadow:0 14px 38px rgba(0,0,0,.28)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#24335f;color:#dbe5ff;font-size:11px;font-weight:800}h1{font-size:21px;margin:12px 0 7px}p{color:#aeb9d9;margin:0}a{color:#8bd5ff}</style></head>
<body><main><div class="box"><span class="tag">ARCHIVE</span><h1>이전 현황 종합본 — 최신 상태는 status 문서 참조</h1><p id="msg">원본 HTML 문서를 불러오는 중입니다…</p></div></main>
<script>(async()=>{try{const files=['assets/legacy_status/part1.txt','assets/legacy_status/part2.txt','assets/legacy_status/part3.txt'];const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f+': HTTP '+r.status);return r.text();}));const b=chunks.join('').trim();const x=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('최신 Chrome/Edge 브라우저에서 열어주세요.');const s=new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'));const t=await new Response(s).text();document.open();document.write(t);document.close();}catch(e){document.getElementById('msg').textContent='문서를 표시할 수 없습니다: '+e.message;}})();</script></body></html>

<!doctype html>
<html data-doc-shell="v1" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Jira Knowledge Pipeline 표준 HTML 문서 템플릿">
  <title>[문서 제목] · Jira Knowledge Pipeline</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#66748a;--line:#d9e2ef;--blue:#3157d5;--green:#14845f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.7}
    .wrap{max-width:1080px;margin:auto;padding:24px 22px 80px}.hero{padding:34px;border-radius:22px;color:#fff;background:linear-gradient(130deg,#18294f,#3157d5 65%,#6d87e7)}h1{margin:8px 0;font-size:clamp(30px,5vw,50px);line-height:1.12}section{margin-top:36px}.card{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.callout{padding:16px;border-left:5px solid var(--green);background:#eaf8f3;border-radius:10px}
  </style>
  <link rel="stylesheet" href="../assets/document-shell.css" data-doc-shell="v1">
  <script defer src="../assets/document-navigation.js" data-doc-shell="v1"></script>
</head>
<body><main class="wrap">
<header class="hero"><strong>DOCUMENT TYPE · YYYY-MM-DD</strong><h1>[문서 제목]</h1><p>[이 문서를 왜 읽는지 한두 문장으로 설명]</p></header>
<section><h2>1. 결론 / 목적</h2><div class="callout"><strong>핵심 한 문장</strong><br>[가장 먼저 알아야 하는 결론]</div></section>
<section><h2>2. 배경</h2><div class="card">[필요한 배경과 용어]</div></section>
<section><h2>3. 상세 내용</h2><div class="card">[표, 다이어그램, 단계별 설명 등]</div></section>
<section><h2>4. 결정 / 다음 행동</h2><div class="card">[확정사항, 미결사항, 다음 단계]</div></section>
</main></body></html>
